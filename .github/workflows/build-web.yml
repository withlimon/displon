name: Build Web

# Everything between <!--sync:start--> and <!--sync:end--> in README.md is rendered
# as Markdown into the same marker pair in index.html, using the site's own design
# (copy-button code blocks, .note alerts, tables, sized screenshots). Nothing else
# in index.html is touched.
on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "assets/screenshots/**"
      - ".github/workflows/build-web.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-web
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install markdown-it-py
        run: python -m pip install "markdown-it-py==4.0.0"

      - name: Render README sync blocks into index.html
        run: |
          python - <<'PY'
          import re
          import struct
          import sys
          from pathlib import Path

          from markdown_it import MarkdownIt
          from markdown_it.common.utils import escapeHtml
          from markdown_it.token import Token

          ROOT = Path.cwd()
          README, PAGE = ROOT / "README.md", ROOT / "index.html"
          ALERTS = {"NOTE": "Note", "TIP": "Tip", "IMPORTANT": "Important",
                    "WARNING": "Warning", "CAUTION": "Caution"}
          BLOCK = re.compile(r"<!--\s*sync:start\s*-->(.*?)<!--\s*sync:end\s*-->", re.S)

          md = MarkdownIt("commonmark", {"html": False}).enable(["table", "strikethrough"])


          def code_block(self, tokens, idx, options, env):
              body = escapeHtml(tokens[idx].content.rstrip("\n"))
              return ('<div class="code"><button class="copy" type="button" '
                      'aria-label="Copy to clipboard">Copy</button>'
                      f"<pre><code>{body}</code></pre></div>\n")


          md.add_render_rule("fence", code_block)
          md.add_render_rule("code_block", code_block)


          def strip_comments(text):
              parts = re.split(r"(^```.*?^```[ \t]*$)", text, flags=re.M | re.S)
              for i in range(0, len(parts), 2):
                  parts[i] = re.sub(r"<!--.*?-->", "", parts[i], flags=re.S)
              return "".join(parts)


          def png_size(rel):
              try:
                  with open(ROOT / rel, "rb") as f:
                      h = f.read(24)
                  if h[:8] == b"\x89PNG\r\n\x1a\n":
                      return struct.unpack(">II", h[16:24])
              except OSError:
                  pass


          def decorate(children):
              for c in children or []:
                  if c.type == "image":
                      c.attrSet("loading", "lazy")
                      size = png_size(c.attrGet("src") or "")
                      if size:
                          c.attrSet("width", str(size[0]))
                          c.attrSet("height", str(size[1]))
                  elif c.type == "link_open" and (c.attrGet("href") or "").startswith("http"):
                      c.attrSet("rel", "noopener")
                  decorate(c.children)


          def alerts(tokens):
              """> [!NOTE] ... blocks and plain quotes -> the site's .note box."""
              for i, t in enumerate(tokens):
                  if t.type != "blockquote_open":
                      continue
                  t.attrSet("class", "note")
                  if tokens[i + 1].type != "paragraph_open":
                      continue
                  inline = tokens[i + 2]
                  m = re.match(r"\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\][ \t]*\n?", inline.content, re.I)
                  if m:
                      rest = inline.content[m.end():]
                      inline.content = rest
                      inline.children = md.parseInline(rest)[0].children if rest else []
                      label = Token("html_inline", "", 0)
                      label.content = f"<strong>{ALERTS[m.group(1).upper()]}:</strong>" + (" " if rest else "")
                      inline.children.insert(0, label)


          def heading_ids(tokens):
              seen = {}
              for i, t in enumerate(tokens):
                  if t.type == "heading_open":
                      slug = re.sub(r"[^a-z0-9]+", "-", tokens[i + 1].content.lower()).strip("-") or "section"
                      seen[slug] = seen.get(slug, 0) + 1
                      t.attrSet("id", slug if seen[slug] == 1 else f"{slug}-{seen[slug]}")


          readme = README.read_text(encoding="utf-8").replace("\r\n", "\n")
          blocks = BLOCK.findall(readme)
          if not blocks:
              sys.exit("README.md has no <!--sync:start--> ... <!--sync:end--> block")

          tokens = md.parse(strip_comments("\n\n".join(b.strip("\n") for b in blocks)))
          alerts(tokens)
          for t in tokens:
              if t.type == "inline":
                  decorate(t.children)
          heading_ids(tokens)
          html = md.renderer.render(tokens, md.options, {}).strip("\n")

          page = PAGE.read_text(encoding="utf-8")
          target = re.compile(r"(<!--\s*sync:start\s*-->\n).*?(\n<!--\s*sync:end\s*-->)", re.S)
          if not target.search(page):
              sys.exit("index.html has no <!--sync:start--> ... <!--sync:end--> block")
          new = target.sub(lambda m: m.group(1) + html + m.group(2), page, 1)
          if new == page:
              print("index.html already up to date.")
          else:
              PAGE.write_text(new, encoding="utf-8")
              print("index.html synced from README.md")
          PY

      - name: Commit index.html
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "index.html already up to date."
            exit 0
          fi
          git commit -m "web: sync index.html from README"
          for i in 1 2 3; do
            git pull --rebase origin "$BRANCH" && git push origin "HEAD:$BRANCH" && exit 0
            echo "push failed (attempt $i), retrying..."
            sleep $((i * 3))
          done
          echo "could not push index.html" >&2
          exit 1
