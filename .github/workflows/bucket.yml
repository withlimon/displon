name: Generate Scoop Manifest

# Rebuilds bucket/displon.json from an existing GitHub release.
# release.yml already does this on every release; use this one to repair
# or create the manifest from the latest (or a chosen) release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.1.20261015 (empty = latest)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate bucket/displon.json
        env:
          TAG_INPUT: ${{ github.event.inputs.tag }}
        run: |
          tag="$TAG_INPUT"
          [ -z "$tag" ] && tag=$(gh release view --repo "$REPO" --json tagName -q .tagName)
          ver="${tag#v}"
          exe="Displon-Setup-$ver.exe"

          gh release download "$tag" --repo "$REPO" -p "$exe.sha256" -O hash.txt
          hash=$(cut -d' ' -f1 hash.txt | tr 'A-Z' 'a-z')
          [ -n "$hash" ] || { echo "No hash found for $tag"; exit 1; }

          mkdir -p bucket
          jq -n --arg ver "$ver" --arg repo "$REPO" --arg exe "$exe" --arg hash "$hash" '
          {
            version: $ver,
            description: "Free open source focus app and distraction blocker for Windows",
            homepage: ("https://github.com/" + $repo),
            license: "GPL-3.0-only",
            notes: "Run in an elevated (admin) terminal. Installs the Displon background service.",
            architecture: { "64bit": {
              url: ("https://github.com/" + $repo + "/releases/download/v" + $ver + "/" + $exe + "#/setup.exe"),
              hash: $hash
            }},
            installer: { file: "setup.exe", args: ["/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-"] },
            uninstaller: { script: ["& \"$env:ProgramFiles\\Displon\\unins000.exe\" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART"] },
            checkver: { github: ("https://github.com/" + $repo) },
            autoupdate: { architecture: { "64bit": {
              url: ("https://github.com/" + $repo + "/releases/download/v$version/Displon-Setup-$version.exe#/setup.exe")
            }}}
          }' > bucket/displon.json
          cat bucket/displon.json

      - name: Commit manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/displon.json
          if git diff --cached --quiet; then
            echo "Manifest already up to date."
          else
            git commit -m "scoop: update displon manifest"
            git pull --rebase origin "${{ github.event.repository.default_branch }}"
            git push origin "HEAD:${{ github.event.repository.default_branch }}"
          fi
