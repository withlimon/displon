name: PR Guard

# Privileged but never checks out / runs PR code. Never merges.
on:
  workflow_run:
    workflows: ["PR Test"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write
  issues: write

jobs:
  decide:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    env:
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pr-result
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Comment and close on failure
        id: dec
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const r = JSON.parse(fs.readFileSync('result.json', 'utf8'));
            const sha = context.payload.workflow_run.head_sha;
            const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              ...context.repo, commit_sha: sha });
            const pr = prs.data.find(p => p.state === 'open' && p.head.sha === sha);
            if (!pr) { core.setOutput('status', 'skip'); return; }
            core.setOutput('number', pr.number);
            core.setOutput('title', pr.title);
            core.setOutput('url', pr.html_url);
            const trusted = ['OWNER', 'MEMBER'].includes(pr.author_association);
            const ok = r.build === 'success' && r.virus === 'success';
            if (ok) { core.setOutput('status', 'pass'); return; }
            core.setOutput('status', 'fail');
            const why = [];
            if (r.virus !== 'success') why.push('🦠 Virus/executable check failed (ClamAV)');
            if (r.build !== 'success') why.push('🔨 Build failed');
            const body = `❌ **Automated checks failed** — this PR is closed and will not be merged.\n\n${why.map(w => '- ' + w).join('\n')}\n\nSee the PR Test run for logs. Fix the issues and open a new PR.`;
            await github.rest.issues.createComment({ ...context.repo, issue_number: pr.number, body });
            if (!trusted) {
              await github.rest.pulls.update({ ...context.repo, pull_number: pr.number, state: 'closed' });
            }

      - name: Comment on pass
        if: steps.dec.outputs.status == 'pass'
        uses: actions/github-script@v9
        env:
          PR: ${{ steps.dec.outputs.number }}
        with:
          script: |
            await github.rest.issues.createComment({ ...context.repo,
              issue_number: Number(process.env.PR),
              body: '✅ Build + virus scan passed. Waiting for manual review (no auto-merge).' });

      - name: Mail me when passed
        if: steps.dec.outputs.status == 'pass' && env.MAIL_USERNAME != ''
        uses: dawidd6/action-send-mail@v23
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to: ${{ secrets.MAIL_TO }}
          from: Displon PR Bot <${{ secrets.MAIL_USERNAME }}>
          subject: "✅ PR #${{ steps.dec.outputs.number }} passed: ${{ steps.dec.outputs.title }}"
          body: "Build and virus scan passed. Review and merge manually: ${{ steps.dec.outputs.url }}"
